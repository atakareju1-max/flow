<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Converse conosco</title>
  <style>
    :root {
      --whatsapp: #25d366;
      --whatsapp-dark: #128c7e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #128c7e, #075e54);
    }

    .card {
      width: min(100%, 420px);
      padding: 48px 28px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--whatsapp);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .logo svg {
      width: 58px;
      height: 58px;
      fill: #ffffff;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--text);
      font-size: clamp(1.7rem, 6vw, 2.3rem);
      line-height: 1.15;
    }

    .whatsapp-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      padding: 16px 24px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--whatsapp);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .whatsapp-button:hover {
      transform: translateY(-3px);
      background: #20bd5b;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
    }

    .whatsapp-button:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.8);
      outline-offset: 4px;
    }

    .whatsapp-button svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>

</html>
